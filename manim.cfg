# Manim Community config, read from the working directory (run manim from the repo root).
# Quality flags (-ql, -qm, -qh, -qp, -qk) set resolution and frame rate; see README.
# Background color: assets/theme.json, applied by scenes/theme.py.
[CLI]
media_dir = ./.cache/manim
video_dir = ./videos/{module_name}/{quality}
images_dir = ./videos/images/{module_name}
partial_movie_dir = {media_dir}/partial_movie_files/{module_name}/{quality}/{scene_name}
